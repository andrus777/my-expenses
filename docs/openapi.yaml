openapi: 3.1.0
info:
  title: My Expenses API
  version: 0.8.0
  description: Every response carries X-Request-ID; every error body repeats it as request_id.
paths:
  /api/v1/auth/register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/auth/login:
    post:
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/ApiError"
  /api/v1/auth/logout:
    post:
      summary: Revoke a refresh token
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/ApiError"
  /api/v1/users/me:
    get:
      summary: Get the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/ApiError"
  /api/v1/categories:
    get:
      summary: List system and owned categories
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Visible categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Category"}
    post:
      summary: Create a user category
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 100}
      responses:
        "201": {description: Category created}
        "400": {$ref: "#/components/responses/ApiError"}
        "409": {$ref: "#/components/responses/ApiError"}
  /api/v1/categories/{category_id}:
    parameters:
      - name: category_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Get a visible category
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Category}
        "404": {$ref: "#/components/responses/ApiError"}
    patch:
      summary: Rename an owned category
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 100}
      responses:
        "200": {description: Category updated}
        "403": {$ref: "#/components/responses/ApiError"}
        "404": {$ref: "#/components/responses/ApiError"}
    delete:
      summary: Delete an unused owned category
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Category deleted}
        "403": {$ref: "#/components/responses/ApiError"}
        "404": {$ref: "#/components/responses/ApiError"}
        "409": {$ref: "#/components/responses/ApiError"}
  /api/v1/expenses:
    get:
      summary: List owned expenses
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: date_from, in: query, schema: {type: string, format: date}}
        - {name: date_to, in: query, schema: {type: string, format: date}}
        - {name: category_id, in: query, schema: {type: string, format: uuid}}
        - {name: min_amount, in: query, schema: {$ref: "#/components/schemas/Money"}}
        - {name: max_amount, in: query, schema: {$ref: "#/components/schemas/Money"}}
        - {name: currency, in: query, schema: {type: string, minLength: 3, maxLength: 3}}
        - {name: source, in: query, schema: {type: string, enum: [MANUAL, RECEIPT, SUBSCRIPTION, SYNC]}}
        - {name: search, in: query, schema: {type: string, maxLength: 100}}
        - {name: sort, in: query, schema: {type: string, enum: [expense_date, amount, created_at]}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc]}}
      responses:
        "200": {description: Paginated expenses}
        "400": {$ref: "#/components/responses/ApiError"}
    post:
      summary: Create an expense idempotently
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExpenseInput"}
      responses:
        "201": {description: Expense created}
        "200": {description: Existing equivalent operation returned}
        "400": {$ref: "#/components/responses/ApiError"}
        "404": {$ref: "#/components/responses/ApiError"}
        "409": {$ref: "#/components/responses/ApiError"}
  /api/v1/expenses/{expense_id}:
    parameters:
      - name: expense_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Get an owned expense
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Expense}
        "404": {$ref: "#/components/responses/ApiError"}
    patch:
      summary: Partially update an owned expense
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExpensePatch"}
      responses:
        "200": {description: Expense updated}
        "400": {$ref: "#/components/responses/ApiError"}
        "404": {$ref: "#/components/responses/ApiError"}
    delete:
      summary: Soft-delete an owned expense
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Expense soft-deleted}
        "404": {$ref: "#/components/responses/ApiError"}
  /api/v1/subscriptions:
    get:
      summary: List subscriptions ordered by next payment date
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Subscription list}
    post:
      summary: Create a subscription
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubscriptionInput"}
      responses:
        "201": {description: Subscription created}
        "400": {$ref: "#/components/responses/ApiError"}
  /api/v1/subscriptions/{subscription_id}:
    parameters:
      - {name: subscription_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Get a subscription
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Subscription}
        "404": {$ref: "#/components/responses/ApiError"}
    patch:
      summary: Update a subscription
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Updated subscription}
    delete:
      summary: Soft-delete a subscription
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Deleted}
  /api/v1/subscriptions/{subscription_id}/payments:
    parameters:
      - {name: subscription_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: List subscription payment history
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Payment history}
    post:
      summary: Atomically confirm a subscription payment
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_operation_id]
              properties:
                client_operation_id: {type: string, format: uuid}
                payment_date: {type: string, format: date}
      responses:
        "201": {description: Payment, expense, and next date created}
        "200": {description: Idempotent replay}
        "409": {$ref: "#/components/responses/ApiError"}
  /api/v1/receipts:
    post:
      summary: Queue receipt processing
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receipt_data]
              properties:
                receipt_data: {type: string, maxLength: 4096}
      responses:
        "202": {description: Receipt job accepted}
        "400": {$ref: "#/components/responses/ApiError"}
  /api/v1/receipts/jobs/{job_id}:
    get:
      summary: Get receipt processing status and preview
      security: [{bearerAuth: []}]
      parameters:
        - {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: PENDING, PROCESSING, COMPLETED or FAILED job}
        "404": {$ref: "#/components/responses/ApiError"}
  /api/v1/receipts/{receipt_id}/finalize:
    post:
      summary: Idempotently create an Expense from a confirmed receipt
      security: [{bearerAuth: []}]
      parameters:
        - {name: receipt_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, client_operation_id]
              properties:
                category_id: {type: string, format: uuid}
                client_operation_id: {type: string, format: uuid}
      responses:
        "201": {description: Expense created}
        "200": {description: Idempotent replay}
        "409": {$ref: "#/components/responses/ApiError"}
  /api/v1/statistics/summary:
    get:
      summary: Expense totals and equal-length previous-period comparison
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/DateFrom"}
        - {$ref: "#/components/parameters/DateTo"}
        - {$ref: "#/components/parameters/Currency"}
      responses:
        "200": {description: Total, operation count, daily average and comparison}
        "400": {$ref: "#/components/responses/ApiError"}
  /api/v1/budgets:
    get:
      summary: List category budgets with calculated usage and threshold events
      security: [{bearerAuth: []}]
      responses:
        "200": {description: User budgets}
    post:
      summary: Create a category budget
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BudgetInput"}
      responses:
        "201": {description: Budget created}
        "400": {$ref: "#/components/responses/ApiError"}
        "409": {$ref: "#/components/responses/ApiError"}
  /api/v1/budgets/{budget_id}:
    parameters:
      - {name: budget_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Get a budget with calculated usage
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Budget}
        "404": {$ref: "#/components/responses/ApiError"}
    patch:
      summary: Partially update a budget
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BudgetInput"}
      responses:
        "200": {description: Budget updated}
        "404": {$ref: "#/components/responses/ApiError"}
        "409": {$ref: "#/components/responses/ApiError"}
    delete:
      summary: Delete a budget and its threshold events
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Budget deleted}
        "404": {$ref: "#/components/responses/ApiError"}
  /api/v1/statistics/categories:
    get:
      summary: Expense distribution by category
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/DateFrom"}
        - {$ref: "#/components/parameters/DateTo"}
        - {$ref: "#/components/parameters/Currency"}
      responses:
        "200": {description: Category totals, counts and percentages}
  /api/v1/statistics/timeline:
    get:
      summary: Expense timeline with zero-filled calendar buckets
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/DateFrom"}
        - {$ref: "#/components/parameters/DateTo"}
        - {$ref: "#/components/parameters/Currency"}
        - name: interval
          in: query
          schema: {type: string, enum: [day, week, month]}
          description: Automatically selected from the range length when omitted
      responses:
        "200": {description: Timeline points}
        "400": {$ref: "#/components/responses/ApiError"}
  /api/v1/statistics/subscriptions:
    get:
      summary: Project active subscription costs to monthly and yearly totals
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/Currency"}
      responses:
        "200": {description: Monthly/yearly totals and active subscription count}
components:
  parameters:
    DateFrom:
      name: date_from
      in: query
      schema: {type: string, format: date}
      description: Inclusive start; defaults to 29 days before date_to
    DateTo:
      name: date_to
      in: query
      schema: {type: string, format: date}
      description: Inclusive end; defaults to today
    Currency:
      name: currency
      in: query
      schema: {type: string, default: RUB, minLength: 3, maxLength: 3}
      description: Single reporting currency; no implicit currency conversion is performed
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BudgetInput:
      type: object
      required: [category_id, amount, period, start_date, end_date]
      properties:
        category_id: {type: string, format: uuid}
        amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string, default: RUB, minLength: 3, maxLength: 3}
        period: {type: string, enum: [WEEK, MONTH, YEAR, CUSTOM]}
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
    SubscriptionInput:
      type: object
      required: [name, category_id, amount, frequency, next_payment_date]
      properties:
        name: {type: string, maxLength: 150}
        category_id: {type: string, format: uuid}
        amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string, minLength: 3, maxLength: 3, default: RUB}
        frequency: {type: string, enum: [WEEKLY, MONTHLY, QUARTERLY, HALF_YEAR, YEARLY, CUSTOM]}
        custom_interval_days: {type: [integer, "null"], minimum: 1}
        next_payment_date: {type: string, format: date}
        comment: {type: [string, "null"]}
    Money:
      type: string
      pattern: '^\d{1,16}(\.\d{1,2})?$'
      examples: ["1250.50"]
    Category:
      type: object
      required: [id, name, is_system, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        is_system: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ExpenseInput:
      type: object
      required: [category_id, amount, expense_date, client_operation_id]
      properties:
        category_id: {type: string, format: uuid}
        amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string, default: RUB, minLength: 3, maxLength: 3}
        expense_date: {type: string, format: date}
        merchant: {type: [string, "null"], maxLength: 255}
        description: {type: [string, "null"], maxLength: 500}
        comment: {type: [string, "null"]}
        source: {type: string, enum: [MANUAL, RECEIPT, SUBSCRIPTION, SYNC], default: MANUAL}
        client_operation_id: {type: string, format: uuid}
    ExpensePatch:
      type: object
      minProperties: 1
      properties:
        category_id: {type: string, format: uuid}
        amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string, minLength: 3, maxLength: 3}
        expense_date: {type: string, format: date}
        merchant: {type: [string, "null"], maxLength: 255}
        description: {type: [string, "null"], maxLength: 500}
        comment: {type: [string, "null"]}
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    User:
      type: object
      required: [id, email, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TokenPair:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    AuthResponse:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/TokenPair"
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        request_id:
          type: string
  responses:
    ApiError:
      description: API error
      headers:
        X-Request-ID:
          description: Correlation ID accepted from the request or generated by the server
          schema: {type: string}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
