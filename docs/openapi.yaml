openapi: 3.1.0
info:
  title: My Expenses API
  version: 0.4.0
paths:
  /api/v1/auth/register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/auth/login:
    post:
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/ApiError"
  /api/v1/auth/logout:
    post:
      summary: Revoke a refresh token
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/ApiError"
  /api/v1/users/me:
    get:
      summary: Get the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/ApiError"
  /api/v1/categories:
    get:
      summary: List system and owned categories
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Visible categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Category"}
    post:
      summary: Create a user category
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 100}
      responses:
        "201": {description: Category created}
        "400": {$ref: "#/components/responses/ApiError"}
        "409": {$ref: "#/components/responses/ApiError"}
  /api/v1/categories/{category_id}:
    parameters:
      - name: category_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Get a visible category
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Category}
        "404": {$ref: "#/components/responses/ApiError"}
    patch:
      summary: Rename an owned category
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 100}
      responses:
        "200": {description: Category updated}
        "403": {$ref: "#/components/responses/ApiError"}
        "404": {$ref: "#/components/responses/ApiError"}
    delete:
      summary: Delete an unused owned category
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Category deleted}
        "403": {$ref: "#/components/responses/ApiError"}
        "404": {$ref: "#/components/responses/ApiError"}
        "409": {$ref: "#/components/responses/ApiError"}
  /api/v1/expenses:
    get:
      summary: List owned expenses
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: date_from, in: query, schema: {type: string, format: date}}
        - {name: date_to, in: query, schema: {type: string, format: date}}
        - {name: category_id, in: query, schema: {type: string, format: uuid}}
        - {name: min_amount, in: query, schema: {$ref: "#/components/schemas/Money"}}
        - {name: max_amount, in: query, schema: {$ref: "#/components/schemas/Money"}}
        - {name: currency, in: query, schema: {type: string, minLength: 3, maxLength: 3}}
        - {name: source, in: query, schema: {type: string, enum: [MANUAL, RECEIPT, SUBSCRIPTION, SYNC]}}
        - {name: search, in: query, schema: {type: string, maxLength: 100}}
        - {name: sort, in: query, schema: {type: string, enum: [expense_date, amount, created_at]}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc]}}
      responses:
        "200": {description: Paginated expenses}
        "400": {$ref: "#/components/responses/ApiError"}
    post:
      summary: Create an expense idempotently
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExpenseInput"}
      responses:
        "201": {description: Expense created}
        "200": {description: Existing equivalent operation returned}
        "400": {$ref: "#/components/responses/ApiError"}
        "404": {$ref: "#/components/responses/ApiError"}
        "409": {$ref: "#/components/responses/ApiError"}
  /api/v1/expenses/{expense_id}:
    parameters:
      - name: expense_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Get an owned expense
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Expense}
        "404": {$ref: "#/components/responses/ApiError"}
    patch:
      summary: Partially update an owned expense
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExpensePatch"}
      responses:
        "200": {description: Expense updated}
        "400": {$ref: "#/components/responses/ApiError"}
        "404": {$ref: "#/components/responses/ApiError"}
    delete:
      summary: Soft-delete an owned expense
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Expense soft-deleted}
        "404": {$ref: "#/components/responses/ApiError"}
  /api/v1/subscriptions:
    get:
      summary: List subscriptions ordered by next payment date
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Subscription list}
    post:
      summary: Create a subscription
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubscriptionInput"}
      responses:
        "201": {description: Subscription created}
        "400": {$ref: "#/components/responses/ApiError"}
  /api/v1/subscriptions/{subscription_id}:
    parameters:
      - {name: subscription_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Get a subscription
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Subscription}
        "404": {$ref: "#/components/responses/ApiError"}
    patch:
      summary: Update a subscription
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Updated subscription}
    delete:
      summary: Soft-delete a subscription
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Deleted}
  /api/v1/subscriptions/{subscription_id}/payments:
    parameters:
      - {name: subscription_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: List subscription payment history
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Payment history}
    post:
      summary: Atomically confirm a subscription payment
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_operation_id]
              properties:
                client_operation_id: {type: string, format: uuid}
                payment_date: {type: string, format: date}
      responses:
        "201": {description: Payment, expense, and next date created}
        "200": {description: Idempotent replay}
        "409": {$ref: "#/components/responses/ApiError"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SubscriptionInput:
      type: object
      required: [name, category_id, amount, frequency, next_payment_date]
      properties:
        name: {type: string, maxLength: 150}
        category_id: {type: string, format: uuid}
        amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string, minLength: 3, maxLength: 3, default: RUB}
        frequency: {type: string, enum: [WEEKLY, MONTHLY, QUARTERLY, HALF_YEAR, YEARLY, CUSTOM]}
        custom_interval_days: {type: [integer, "null"], minimum: 1}
        next_payment_date: {type: string, format: date}
        comment: {type: [string, "null"]}
    Money:
      type: string
      pattern: '^\d{1,16}(\.\d{1,2})?$'
      examples: ["1250.50"]
    Category:
      type: object
      required: [id, name, is_system, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        is_system: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ExpenseInput:
      type: object
      required: [category_id, amount, expense_date, client_operation_id]
      properties:
        category_id: {type: string, format: uuid}
        amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string, default: RUB, minLength: 3, maxLength: 3}
        expense_date: {type: string, format: date}
        merchant: {type: [string, "null"], maxLength: 255}
        description: {type: [string, "null"], maxLength: 500}
        comment: {type: [string, "null"]}
        source: {type: string, enum: [MANUAL, RECEIPT, SUBSCRIPTION, SYNC], default: MANUAL}
        client_operation_id: {type: string, format: uuid}
    ExpensePatch:
      type: object
      minProperties: 1
      properties:
        category_id: {type: string, format: uuid}
        amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string, minLength: 3, maxLength: 3}
        expense_date: {type: string, format: date}
        merchant: {type: [string, "null"], maxLength: 255}
        description: {type: [string, "null"], maxLength: 500}
        comment: {type: [string, "null"]}
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    User:
      type: object
      required: [id, email, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TokenPair:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    AuthResponse:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/TokenPair"
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        request_id:
          type: string
  responses:
    ApiError:
      description: API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
