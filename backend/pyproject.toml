[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "my-expenses-backend"
version = "0.1.0"
description = "Backend API for My Expenses"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "celery[redis]>=5.4,<6",
    "email-validator>=2.2,<3",
    "Flask>=3.1,<4",
    "Flask-JWT-Extended>=4.7,<5",
    "Flask-Limiter>=3.12,<5",
    "Flask-Migrate>=4.1,<5",
    "Flask-SQLAlchemy>=3.1,<4",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
