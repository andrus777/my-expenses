[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "my-expenses-backend"
version = "0.1.0"
description = "Backend API for My Expenses"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "celery[redis]>=5.4,<6",
    "email-validator>=2.2,<3",
    "Flask>=3.1,<4",
    "Flask-JWT-Extended>=4.7,<5",
    "Flask-Limiter>=3.12,<5",
    "Flask-Migrate>=4.1,<5",
    "Flask-SQLAlchemy>=3.1,<4",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pre-commit>=4.2,<5",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = [
    "app/config.py",
    "app/observability.py",
    "app/receipts/provider.py",
    "app/schemas/statistics.py",
    "app/subscriptions/calculator.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"
