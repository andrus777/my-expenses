services:
  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://my_expenses:change-me-for-local-development@postgres:5432/my_expenses}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RECEIPT_PROVIDER: ${RECEIPT_PROVIDER:-fake}
      RECEIPT_PROVIDER_URL: ${RECEIPT_PROVIDER_URL:-}
      RECEIPT_PROVIDER_API_KEY: ${RECEIPT_PROVIDER_API_KEY:-}
      RECEIPT_PROVIDER_TIMEOUT_SECONDS: ${RECEIPT_PROVIDER_TIMEOUT_SECONDS:-10}
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-3}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-3}
      READINESS_DB_TIMEOUT_MS: ${READINESS_DB_TIMEOUT_MS:-3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: sh -c "celery -A worker:celery worker --loglevel=$${LOG_LEVEL:-INFO}"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://my_expenses:change-me-for-local-development@postgres:5432/my_expenses}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RECEIPT_PROVIDER: ${RECEIPT_PROVIDER:-fake}
      RECEIPT_PROVIDER_URL: ${RECEIPT_PROVIDER_URL:-}
      RECEIPT_PROVIDER_API_KEY: ${RECEIPT_PROVIDER_API_KEY:-}
      RECEIPT_PROVIDER_TIMEOUT_SECONDS: ${RECEIPT_PROVIDER_TIMEOUT_SECONDS:-10}
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-3}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-3}
      READINESS_DB_TIMEOUT_MS: ${READINESS_DB_TIMEOUT_MS:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_expenses}
      POSTGRES_USER: ${POSTGRES_USER:-my_expenses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
